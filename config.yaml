project:
  name: churn-prediction

data:
  raw_path: data/raw/churn.csv
  new_data_path: data/raw/new_churn.csv
  processed_dir: data/processed
  target_column: Churn
  id_column: customerID

split:
  test_size: 0.2
  random_state: 42
  stratify: true

paths:
  preprocessor: models/preprocessor.pkl
  model: models/churn_model.pkl
  best_model: models/churn_model.pkl
  ohe: models/ohe.pkl
  scaler: models/scaler.pkl
  failure_report: artifacts/lab9_failure_report.json
  evaluation_report: artifacts/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
model:
  n_estimators: 200
  max_depth: 10
  random_state: 42
  class_weight: balanced

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: churn-prediction
  registry_name: churn_prediction_model
registry:
  model_name: churn_prediction_model
  decision_metric: recall

lab9:
  repetitions: 3
quality_gate:
  metric: recall
  minimum_value: 0.70